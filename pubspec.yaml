dependencies:
  carousel_slider: ^5.1.2
  smooth_page_indicator: ^2.0.1
  device_preview: ^1.3.1
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  go_router: ^17.0.0
  google_fonts: ^6.3.3
  easy_localization: ^3.0.8
  flutter_bloc: ^9.1.1
  bloc: ^9.1.0
  get_it: ^8.0.0
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0
  flutter_native_splash: ^2.4.8
  dartz: ^0.10.1
  intl: ^0.20.2
  dio: ^5.9.2
  jiffy: ^6.4.0
  shimmer: ^3.0.0
  local_auth: ^2.3.0
