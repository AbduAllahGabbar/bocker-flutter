  assets:
    - assets/translations/ar-SA.json
    - assets/translations/en-US.json
    - assets/logo.png
    - assets/on_boarding/on_boarding_1.png
    - assets/on_boarding/on_boarding_2.png
    - assets/on_boarding/on_boarding_3.png
    - assets/flags/
