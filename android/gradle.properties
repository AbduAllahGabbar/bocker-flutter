org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false

# Kotlin compile daemon settings.
#
# -Duser.language/-Duser.country: on a machine whose default locale renders
# digits as Arabic-Indic numerals, the daemon starts and listens but the Gradle
# side can never connect to it ("Failed connecting to the daemon in 4 retries"),
# so every build burned the retries and then fell back to slower in-process
# compilation. Forcing an ASCII-digit locale for the daemon JVM fixes it.
# Verified by toggling this flag alone: with it 0 errors, without it 4.
#
# -Xmx2G: the daemon otherwise inherits org.gradle.jvmargs (8G heap + 4G
# metaspace), which is far more than this module's Kotlin sources need.
kotlin.daemon.jvmargs=-Xmx2G -Duser.language=en -Duser.country=US
